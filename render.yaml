services:
  - type: web
    name: convention-hall
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@hall.local
      - key: SEED_ADMIN_PASSWORD
        value: Admin@12345
      - key: PAYMENT_PROVIDER
        value: mock
